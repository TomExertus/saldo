name: Build Android APK & Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android Release APK
        working-directory: ./android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk SaldoMovimenti-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaldoMovimenti-Android-APK
          path: SaldoMovimenti-Android.apk

  build-windows:
    name: Build Windows EXE (Setup & Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Build Windows Executables
        working-directory: ./windows/electron
        run: |
          npm install
          npm run build:win

      - name: Collect Windows Executables
        shell: bash
        run: |
          mkdir -p dist-win
          cp windows/electron/dist/*.exe dist-win/

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaldoMovimenti-Windows-EXE
          path: dist-win/*.exe

  publish-release:
    name: Publish GitHub Release
    needs: [ build-android, build-windows ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: SaldoMovimenti-Android-APK
          path: release-assets

      - name: Download Windows EXEs
        uses: actions/download-artifact@v4
        with:
          name: SaldoMovimenti-Windows-EXE
          path: release-assets

      - name: Create or Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Saldo e Movimenti v1.1.0 (Windows .exe & Android .apk)"
          body: |
            ### 📦 Download Diretti Windows & Android
            - 🤖 **Android (`.apk`)**: Scarica `SaldoMovimenti-Android.apk` e aprilo sul tuo smartphone Android per installare l'app nativa.
            - 💻 **Windows Portatile (`.exe`)**: Scarica `SaldoMovimenti-Windows-Portable.exe` per avviare subito l'app su Windows 10/11 senza installazione.
            - 💻 **Windows Installer (`.exe`)**: Scarica l'installer NSIS per installare l'app con collegamento sul Desktop e nel Menu Start.
          files: release-assets/*
          prerelease: false
